version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: domains
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d domains"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./back-end
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/domains
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./back-end
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/domains
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-worker:
    build: ./back-end
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/domains
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build: ./back-end
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/domains
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.celery_app.celery", "beat", "--loglevel=info"]
    depends_on:
      - celery-worker

  frontend:
    build: ./front-end
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
