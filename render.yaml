# Render Blueprint — first safe online test.
# This deploys only the API and a disposable test database. Add the frontend
# after the API URL exists so CORS and NEXT_PUBLIC_API_URL can be set correctly.
# Keep all trading and outbound actions in paper/off mode.
services:
  - type: web
    name: ai-domain-trader-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: back-end
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-domain-trader-db
          property: connectionString
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: FRONTEND_URL
        value: http://localhost:3000

databases:
  - name: ai-domain-trader-db
    plan: free
    region: frankfurt
    databaseName: domaintrader
    user: domaintrader
